name: Radio Vault parity

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  windows:
    name: Windows client and server
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install .NET 8 runtime and pinned SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.423
            10.0.302

      - name: Run complete Windows release gate
        shell: pwsh
        run: ./release-gate.ps1

      - name: Publish Windows Client
        shell: pwsh
        run: >-
          dotnet publish
          ./TheRadioVault.Desktop.Avalonia/TheRadioVault.Desktop.Avalonia.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -p:ContinuousIntegrationBuild=true
          -p:Deterministic=true
          -o ./artifacts/ci/windows-client

      - name: Publish Windows Server
        shell: pwsh
        run: >-
          dotnet publish
          ./TheRadioVault.Server/TheRadioVault.Server.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -p:ContinuousIntegrationBuild=true
          -p:Deterministic=true
          -o ./artifacts/ci/windows-server

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Create Windows setup executables
        shell: pwsh
        run: ./package-windows-ci-installers.ps1

      - name: Upload Windows installers and portable builds
        uses: actions/upload-artifact@v6
        with:
          name: windows-client-and-server
          path: |
            artifacts/ci/windows-client/
            artifacts/ci/windows-server/
            artifacts/ci/windows-installers/*.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS client and server
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install .NET 8 runtime and pinned SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.423
            10.0.302

      - name: Restore shared solution
        run: dotnet restore TheRadioVault.sln

      - name: Build macOS Client
        run: >-
          dotnet build
          TheRadioVault.Desktop.Avalonia/TheRadioVault.Desktop.Avalonia.csproj
          -c Release --no-restore -warnaserror
          -p:ContinuousIntegrationBuild=true
          -p:Deterministic=true

      - name: Build macOS Server
        run: >-
          dotnet build
          TheRadioVault.Server/TheRadioVault.Server.csproj
          -c Release --no-restore -warnaserror
          -p:ContinuousIntegrationBuild=true
          -p:Deterministic=true

      - name: Build smoke-test runner
        run: >-
          dotnet build
          TheRadioVault.Tests/TheRadioVault.Tests.csproj
          -c Release --no-restore -warnaserror
          -p:ContinuousIntegrationBuild=true
          -p:Deterministic=true

      - name: Run macOS parity smoke tests
        run: |
          dotnet run --project TheRadioVault.Tests/TheRadioVault.Tests.csproj \
            -c Release --no-build -- \
            "Mac client remains usable before server pairing" \
            "Mac Client uses native AVFoundation and existing server contracts" \
            "macOS and Linux packages preserve the shared client-server boundary" \
            "Core hardening platform requests remain neutral"

      - name: Package unsigned Apple Silicon Client
        shell: pwsh
        run: ./package-macos-client.ps1 -RuntimeIdentifier osx-arm64

      - name: Package unsigned Apple Silicon Server
        shell: pwsh
        run: ./package-macos-server.ps1 -RuntimeIdentifier osx-arm64

      - name: Create macOS disk image installers
        run: ./package-macos-installers.sh

      - name: Upload macOS installers and portable builds
        uses: actions/upload-artifact@v6
        with:
          name: macos-client-and-server-osx-arm64-unsigned
          path: |
            artifacts/macos/osx-arm64/RadioVault.Client-*-unsigned.zip
            artifacts/macos-server/osx-arm64/RadioVault.Server-*-unsigned.zip
            artifacts/installers/macos/osx-arm64/*.dmg
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux client and server
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install .NET 8 runtime and pinned SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.423
            10.0.302

      - name: Restore shared solution
        run: dotnet restore TheRadioVault.sln

      - name: Build Linux Client
        run: >-
          dotnet build
          TheRadioVault.Desktop.Avalonia/TheRadioVault.Desktop.Avalonia.csproj
          -c Release --no-restore -warnaserror
          -p:ContinuousIntegrationBuild=true
          -p:Deterministic=true

      - name: Build Linux Server
        run: >-
          dotnet build
          TheRadioVault.Server/TheRadioVault.Server.csproj
          -c Release --no-restore -warnaserror
          -p:ContinuousIntegrationBuild=true
          -p:Deterministic=true

      - name: Build smoke-test runner
        run: >-
          dotnet build
          TheRadioVault.Tests/TheRadioVault.Tests.csproj
          -c Release --no-restore -warnaserror
          -p:ContinuousIntegrationBuild=true
          -p:Deterministic=true

      - name: Run Linux platform smoke tests
        run: |
          dotnet run --project TheRadioVault.Tests/TheRadioVault.Tests.csproj \
            -c Release --no-build -- \
            "macOS and Linux packages preserve the shared client-server boundary" \
            "Core hardening platform requests remain neutral"

      - name: Package Linux installers and portable builds
        run: ./package-linux.sh

      - name: Upload Linux installers and portable builds
        uses: actions/upload-artifact@v6
        with:
          name: linux-client-and-server-x64
          path: |
            artifacts/linux/linux-x64/*.tar.gz
            artifacts/linux/linux-x64/*.deb
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS client
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install .NET 8 runtime and pinned SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.423
            10.0.302

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install pinned iOS workload
        run: dotnet workload install ios

      - name: Build iOS Simulator Client
        run: >-
          dotnet build
          TheRadioVault.Client.iOS/TheRadioVault.Client.iOS.csproj
          -c Release -r iossimulator-arm64 -warnaserror
          -p:ContinuousIntegrationBuild=true
          -p:Deterministic=true

      - name: Build iOS offline regression runner
        run: >-
          dotnet build
          TheRadioVault.Client.Mobile.Tests/TheRadioVault.Client.Mobile.Tests.csproj
          -c Release -warnaserror
          -p:ContinuousIntegrationBuild=true
          -p:Deterministic=true

      - name: Run iOS offline and handoff regression checks
        run: >-
          dotnet run --project TheRadioVault.Client.Mobile.Tests/TheRadioVault.Client.Mobile.Tests.csproj
          -c Release --no-build

      - name: Build smoke-test runner
        run: >-
          dotnet build
          TheRadioVault.Tests/TheRadioVault.Tests.csproj
          -c Release -warnaserror
          -p:ContinuousIntegrationBuild=true
          -p:Deterministic=true

      - name: Run iOS architecture smoke test
        run: >-
          dotnet run --project TheRadioVault.Tests/TheRadioVault.Tests.csproj
          -c Release --no-build --
          "iOS Client preserves native platform and server boundaries"

      - name: Upload unsigned Simulator app
        uses: actions/upload-artifact@v6
        with:
          name: ios-client-simulator-arm64-unsigned
          path: TheRadioVault.Client.iOS/bin/Release/net10.0-ios/iossimulator-arm64/TheRadioVault.Client.iOS.app/
          if-no-files-found: error
          retention-days: 14
